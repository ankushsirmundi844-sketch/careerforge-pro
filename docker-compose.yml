version: '3.9'

services:
  backend:
    build: ./backend
    container_name: careerforge_backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: careerforge_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
